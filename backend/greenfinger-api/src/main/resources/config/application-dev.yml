# Development: open about what is wrong, because you are the one reading it.
#
# The same keys as the other profile, different answers. What does not change between the two is
# in application.yml beside this file, and what an installation wants to change is a GF_* in
# .env -- these are only the defaults each profile starts from.

server:
  error:
    # The message, not the stack trace
    include-message: ${GF_ERROR_MESSAGE:always}

management:
  endpoints:
    web:
      exposure:
        # spreader and spreader-report are the cluster's own: buffer water levels, dropped
        # message counts, split brain, whether this node can still see a leader. None of that is
        # guessable from the logs -- a full inbound buffer discards silently, by design.
        # settings is greenfinger's own configuration as it ended up after yaml, .env and the
        # command line had their say, secrets masked: the only correct answer to "which won".
        include: ${GF_ACTUATOR_ENDPOINTS:health,info,metrics,settings,spreader,spreader-report}
  endpoint:
    health:
      # every check by name: the cluster page is worth more than the secrecy on your own machine
      show-details: ${GF_HEALTH_DETAILS:always}
