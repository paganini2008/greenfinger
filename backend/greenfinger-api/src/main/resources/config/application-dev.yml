# The server, on a machine you are sitting at.
#
# The default profile, and it assumes the browser is on the same laptop: the Angular dev server on
# 4200 and the front end container on 9700 are allowed by name, an error carries its message, and
# the actuator is open enough to see what the cluster is doing.
#
# Everything is still a variable, so one line in .env moves any of it without leaving the profile.
# Switch to prod (GF_PROFILE=prod) when somebody other than you can reach the port.

server:
  error:
    # the message, in the response, because the person reading it is the person who wrote the bug
    include-message: always

management:
  endpoint:
    health:
      # what is wrong with a node, to a browser on this machine: the cluster page is worth more
      # than the secrecy here
      show-details: always

greenfinger:
  security:
    # On, even here. Turning it off is a deployment decision (GF_SECURITY_ENABLED=false behind a
    # private network) rather than a development convenience: an api that is open in development
    # and closed in production is an api whose authorisation is only ever tested in production.
    enabled: ${GF_SECURITY_ENABLED:true}
