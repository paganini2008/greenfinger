# Production: says what it must and no more.
#
# The same keys as the other profile, different answers. What does not change between the two is
# in application.yml beside this file, and what an installation wants to change is a GF_* in
# .env -- these are only the defaults each profile starts from.

server:
  error:
    # a message written for a caller can still name a table or a path
    include-message: ${GF_ERROR_MESSAGE:never}

management:
  endpoints:
    web:
      exposure:
        # health for the load balancer, settings and the cluster's two for the System page.
        # Not metrics: it lists every url pattern this node has served.
        include: ${GF_ACTUATOR_ENDPOINTS:health,settings,spreader,spreader-report}
  endpoint:
    health:
      # up or down to a probe; the detail is behind an account on the System page
      show-details: ${GF_HEALTH_DETAILS:never}
