# Greenfinger settings.
#
# One file, read by all four launchers -- greenfinger-cli.sh, greenfinger-face.sh, run-local.sh
# and run-docker.sh -- because a node is a node whichever of them started it, and the same answers
# should not have to be typed differently four times.
#
# None of these is a command line option any more. They describe the installation rather than the
# command being run: the same answer every time you type anything, and a different answer means a
# different node. What varies per command still lives on the line -- `catalog-crawl --id=<id>
# --node=3` is all command.
#
# Secrets and the addresses of databases and stores go in .env instead. Two files because they
# have different lifetimes: this one describes a run, .env describes the machine, and only one of
# them is dangerous to share.
#
# Anything already exported wins over what is written here, so a one-off is
#
#     GF_NODES=3 ./run-local.sh
#     GF_DATA_STORE=/tmp/scratch ./greenfinger-cli.sh catalog-list
#
# without editing anything.

# ================================================================================================
# Every launcher: what this node is and where it writes
# ================================================================================================

# The one directory everything this node writes lives under, split in two underneath:
#
#   system/  what the crawler needs while it is crawling -- the frontier, the two dedup stores,
#            and the H2 or SQLite file when no database server was configured. Losing it costs a
#            resume, never a search.
#   user/    what was crawled -- assets/ (pages and images), index/ and vector/. This is what a
#            search reads, so it is the directory worth backing up.
#
# Empty means data/ beside the launcher -- so where you happened to cd to before typing the
# command does not decide where a crawl is written.
#
# **Worth setting to somewhere outside deploy/.** Everything else in deploy/ is made by the build
# and is meant to be deletable: `rm -rf deploy` and rebuild is the ordinary way to upgrade. With
# the default, that takes every page you have ever crawled with it. Anywhere else survives:
#
#     GF_DATA_STORE=/var/lib/greenfinger
#     GF_DATA_STORE=$HOME/greenfinger-data
#
# run-local.sh and run-docker.sh give each of their nodes its own directory under GF_DATA_ROOT
# instead; see below.
#
# **One node, one data store, read and written by that node alone.** Every node keeps a complete
# copy -- its own database file, its own pages, its own dedup stores -- and replication is what
# keeps the copies the same. That is the model at every scale, two processes on this machine or
# four machines in a rack, and it is the same for H2 on disk, for H2 in memory and for SQLite. A
# shared file is never how nodes agree.
#
# Several processes *can* read one store -- a prompt opened beside a running server to list
# catalogs or search -- but only one may write to it: the frontier and the two dedup stores are
# RocksDB and take an exclusive lock on their directory. So a process that has to crawl is a node
# and wants a store of its own. run-local.sh gives each of its nodes one for exactly that reason,
# and a second crawl out of a store that is already busy is refused by name rather than by a
# RocksDB lock error.
GF_DATA_STORE=

# A cluster is everybody sharing a name and a port, and both halves matter. The name decides who
# joins whom -- two installations sharing it become one cluster and find that out by replicating
# each other's writes, deletes included. The port is the election: whoever holds it leads, and
# holding a port is machine-wide rather than per cluster, so a second cluster with its own name
# but the same port never elects anybody.
#
# Left empty, each launcher picks a name that keeps its own nodes together and apart from the
# others': "default" for greenfinger-cli.sh and greenfinger-face.sh, so two
# terminals on one machine are one cluster without anybody saying so; "greenfinger-local" for
# run-local.sh and "greenfinger-docker" for run-docker.sh, so a set of containers left running
# neither merges with nodes started by hand nor takes the port they elect on.
#
# Name it here and every launcher on this machine joins that one cluster instead -- which is what
# you want when the prompt and the server are meant to share a crawl, and what you do not want
# when two unrelated things are running. Give both halves or neither: a second cluster with its
# own name but the same port never elects anybody, because the port is taken by a node it does
# not consider a member.
GF_CLUSTER_NAME=
GF_CLUSTER_PORT=

# Other machines to knock on, comma separated, when the cluster spans more than this one:
#
#     GF_CLUSTER_HOSTS=a.example,b.example
#
# Empty finds the other processes on this machine and nothing else, which is right for the usual
# case and useless across machines. Setting it also unpins the address a node advertises: that is
# fixed at 127.0.0.1 in the configuration so several processes on one machine do not advertise an
# interface none of them can reach, and the moment another machine has to dial this one that
# default becomes the bug. GF_CLUSTER_ADVERTISE_HOST in .env names it explicitly.
GF_CLUSTER_HOSTS=

# Where extra local nodes keep their data when `catalog-crawl --node=3` forks them. Empty means
# workers/ under the data store, beside system/ and user/ rather than inside either -- a worker
# directory nested in one of those would show up in everything that walks node 1's files.
GF_WORKER_ROOT=

# Where every launcher writes its log. One directory, because four scripts each choosing their
# own is four places to look when something went wrong at three in the morning -- and the file
# name inside it already says which process wrote it: greenfinger.log for the prompt and the
# one-shot command line, node-N.log for the server's nodes, cli-worker-N.log for the ones a crawl
# forks. Containers log to docker, which is `run-docker.sh logs 2`.
#
# Empty means logs/ beside the launcher.
GF_LOG_DIR=

# How long a crawl may stand still before it is wound up, and how often that is checked. Standing
# still with every dispatched url handled means the site ran out of urls: the crawl is finished
# and the version is published, without waiting out fetchDuration. Standing still with urls
# unaccounted for means a node stopped answering: the run ends and publishes nothing.
#
# It is therefore also how long a site smaller than maxFetchSize waits after its last page. Lower
# it for small sites; raise it for a slow one where a single fetch can take minutes.
GF_IDLE_TIMEOUT=2m
GF_COMPLETION_CHECK_INTERVAL=5s

# How much heap each jvm gets. One name for all four launchers, because "how much memory does it
# get" is the same question whether the jvm is started by the prompt, by the command line, by
# run-local.sh or in a container.
#
# 1g is enough for a crawl that writes files and a Lucene index. Turn the vector output on and the
# embedding model wants room: below about 2g a container is killed by the kernel, which shows up
# as exit code 137 and nothing else to say what happened. JAVA_OPTS still overrides it outright.
GF_MEMORY=1g

# ================================================================================================
# run-local.sh and run-docker.sh: the shape of a multi-node run
# ================================================================================================

# How many nodes. One process is a cluster of one; more than one share the crawl between them.
GF_NODES=1

# The first node's http port. The others follow on from it: 50080, 50081, 50082 ...
GF_BASE_PORT=50080

# The parent directory for the nodes' data -- each gets its own underneath, because every node
# holds a complete copy and replication keeps the copies the same. Two nodes on one H2 file would
# spend the crawl negotiating a lock.
#
# Empty means data/ beside the scripts for run-local.sh, and a named docker volume per node for
# run-docker.sh. This is the multi-node counterpart of GF_DATA_STORE above, which is one node's.
GF_DATA_ROOT=

# ================================================================================================
# run-docker.sh only
# ================================================================================================

# The front end container: the app on one address, in front of all the nodes. 0 runs the nodes
# only -- they each serve the app themselves, so this is about having one address rather than
# about having the app at all.
GF_WEB=1
GF_WEB_PORT=9700

# The api address the browser should use, written into env.js in the front end container. Empty is
# right when that container forwards /v2 itself, which it does; set it only when the api is
# somewhere it is not forwarding to.
GF_API_BASE_URL=



# The docker network. Fixed addresses rather than container names, because a node advertises the
# address it is reached on and a name is not one. .10 upwards: the gateway takes .1.
GF_SUBNET=172.28.0.0/16
GF_IP_PREFIX=172.28.0.
GF_IP_START=10
