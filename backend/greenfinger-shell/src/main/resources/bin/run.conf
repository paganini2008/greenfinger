# Greenfinger: what the launchers need, and nothing the application reads.
#
# Read by all four launchers -- greenfinger-cli.sh, greenfinger-shell.sh, run-local.sh and
# run-docker.sh -- and by nothing else. How many processes to start, on which ports, with how much
# heap, where each one's directories go: shell questions, answered before a jvm exists.
#
# What the application itself reads is in .env, whether a launcher started it or not. That is the
# line between the two files, and it is the only line: a setting that application.yml resolves
# with ${GF_...} belongs there, because .env is also imported by Spring and this file is not --
# so a main class started from an IDE sees .env and never sees this.
#
# Anything already exported wins over what is written here, so a one-off is
#
#     GF_NODES=3 ./run-local.sh
#
# ================================================================================================
# Every launcher: what this node is and where it writes
# ================================================================================================

# Where extra local nodes keep their data when `catalog-crawl --node=3` forks them. Empty means
# workers/ under the data store, beside system/ and user/ rather than inside either -- a worker
# directory nested in one of those would show up in everything that walks node 1's files.
GF_WORKER_ROOT=

# Where every launcher writes its log. One directory, because four scripts each choosing their
# own is four places to look when something went wrong at three in the morning -- and the file
# name inside it already says which process wrote it: greenfinger.log for the prompt and the
# one-shot command line, node-N.log for the server's nodes, cli-worker-N.log for the ones a crawl
# forks. Containers log to docker, which is `run-docker.sh logs 2`.
#
# Empty means logs/ beside the launcher.
GF_LOG_DIR=

# How much heap each jvm gets. One name for all four launchers, because "how much memory does it
# get" is the same question whether the jvm is started by the prompt, by the command line, by
# run-local.sh or in a container.
#
# 1g is enough for a crawl that writes files and a Lucene index. Turn the vector output on and the
# embedding models want room, and they want it outside the heap: onnxruntime holds well over a
# gigabyte of native memory that -Xmx knows nothing about. run-docker.sh drops the heap's share of
# the container from 70% to 45% when the vector output is on for exactly that reason; give a node
# 2.5g or more as well. Under that the kernel kills the container -- exit code 137, and nothing in
# the log, because the jvm never gets to say anything. JAVA_OPTS still overrides it outright.
#
# Measured, not guessed: with the heap at 70% a vector node was killed at 1g and again at 3g.
GF_MEMORY=1g

# ================================================================================================
# run-local.sh and run-docker.sh: the shape of a multi-node run
# ================================================================================================

# How many nodes. One process is a cluster of one; more than one share the crawl between them.
GF_NODES=1

# The first node's http port. The others follow on from it: 50080, 50081, 50082 ...
GF_BASE_PORT=50080

# The parent directory for the nodes' data -- each gets its own underneath, because every node
# holds a complete copy and replication keeps the copies the same. Two nodes on one H2 file would
# spend the crawl negotiating a lock.
#
# Empty means data/ beside the scripts for run-local.sh, and a named docker volume per node for
# run-docker.sh. This is the multi-node counterpart of GF_DATA_STORE above, which is one node's.
GF_DATA_ROOT=

# ================================================================================================
# run-local.sh and run-docker.sh: the front end
# ================================================================================================

# Whether to start the front end alongside the nodes: its own process here, its own container
# there, on its own port either way. The page and the api are two things, and one address in front
# of every node is the point of it -- a browser pointed at a single node is talking to that node
# rather than to the cluster.
#
# run-local.sh defaults this to 0 and `./run-local.sh all` turns it on for one run; setting it to
# 1 here makes both scripts start it every time. It needs the build -- `npm run build:deploy` in
# frontend/greenfinger-ui -- and, for run-local.sh, node on the path.
#
# Whether to start it is an orchestration decision and belongs here. What it is configured with
# once started -- its port, the api address it hands the browser -- is in .env with everything
# else a process reads.
GF_WEB=1

# Where the built app is. Empty means deploy/docker/static, which is where build:deploy puts it
# and where the image copies it from. A path inside this directory rather than a setting, so it
# stays here.
GF_STATIC=



# ================================================================================================
# run-docker.sh only
# ================================================================================================

# The docker network. Fixed addresses rather than container names, because a node advertises the
# address it is reached on and a name is not one. .10 upwards: the gateway takes .1.
GF_SUBNET=172.28.0.0/16
GF_IP_PREFIX=172.28.0.
GF_IP_START=10

