# Production: MySQL, because a real installation has a database server.
#
# The only file that differs between the two profiles, and only in these four values: everything
# else is in application.yml and is the same whichever is active. Set GF_DB_* in .env to point at
# something else -- the driver has to be on the classpath for a database the build does not
# bundle.

spring:
  datasource:
    url: ${GF_DB_URL:jdbc:mysql://localhost:3306/greenfinger?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${GF_DB_USERNAME:greenfinger}
    password: ${GF_DB_PASSWORD:}
    driver-class-name: ${GF_DB_DRIVER:com.mysql.cj.jdbc.Driver}
