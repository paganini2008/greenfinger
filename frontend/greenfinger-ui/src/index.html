<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greenfinger</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The leafed G from the logo, cut out by tools/make-icons.mjs. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#2e7d32" />
    <meta
      name="description"
      content="Greenfinger: a full-web crawler. Crawl a site, keep every version, search what you kept."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex, because this is an instrument rather than a website. Plex Sans was drawn for
         engineering interfaces and has a squarer, more mechanical eye than the grotesques every
         dashboard defaults to; Plex Mono is its sibling rather than a stranger, so urls, paths and
         hashes sit beside prose without a change of voice. Four sans weights and one mono. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <!-- Read before the bundle: it carries the api address for the front end container, which is
         a different origin from the nodes. Same origin everywhere else, which is the default. -->
    <script src="env.js"></script>
    <app-root></app-root>
    <script>
      // There is one scheme now -- green on white -- so nothing here chooses one. This clears
      // what the old switch left in the browsers of anybody who used it, rather than leaving a
      // dead attribute and a dead key sitting in storage for ever.
      try {
        localStorage.removeItem('gf-theme');
        delete document.documentElement.dataset.theme;
      } catch (e) {
        // storage blocked: there was nothing to clear
      }
    </script>
  </body>
</html>
