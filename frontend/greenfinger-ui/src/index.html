<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greenfinger</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The leafed G from the logo, cut out by tools/make-icons.mjs. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#2e7d32" />
    <meta
      name="description"
      content="Greenfinger: a full-web crawler. Crawl a site, keep every version, search what you kept."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Figtree for everything a person reads, JetBrains Mono for everything a machine wrote.
         Plex Sans was here first and was drawn for engineering interfaces: a square, mechanical
         eye that fought the page around it, which is cream paper, big rounded cards and a green
         sidebar. Figtree is humanist with open apertures and rounded terminals, so it belongs to
         that page, and it holds up at the small sizes these tables are set in. The mono is for
         ids, urls and paths, where a slashed zero is the difference between reading a value and
         guessing it. Four sans weights and two mono. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <!-- Read before the bundle: it carries the api address for the front end container, which is
         a different origin from the nodes. Same origin everywhere else, which is the default. -->
    <script src="env.js"></script>
    <app-root></app-root>
    <script>
      // There is one scheme now -- green on white -- so nothing here chooses one. This clears
      // what the old switch left in the browsers of anybody who used it, rather than leaving a
      // dead attribute and a dead key sitting in storage for ever.
      try {
        localStorage.removeItem('gf-theme');
        delete document.documentElement.dataset.theme;
      } catch (e) {
        // storage blocked: there was nothing to clear
      }
    </script>
  </body>
</html>
